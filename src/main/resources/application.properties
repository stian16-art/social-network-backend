# --- Server ---
server.port=8080

# --- Database (PostgreSQL) ---
# Palitan ang username/password/db name base sa local Postgres mo
spring.datasource.url=jdbc:postgresql://localhost:5432/social_network
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# IMPORTANT: palitan ito ng sarili mong random, mahabang secret string (32+ chars) bago i-deploy.
# Huwag i-commit ang totoong secret sa git; gamitin ang environment variable sa production.
app.jwt.secret=CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_KEY_BEFORE_PRODUCTION_USE

# Access token: 1 oras na lang ang bisa (dati 24 oras) - mas maikli, mas secure,
# dahil ang refresh token na ang bahala humingi ng bago pag nag-expire ito.
app.jwt.expiration-ms=3600000

# Refresh token: 30 araw ang bisa - ito yung "matagalang" token na naka-imbak
# sa database, ginagamit lang para humingi ng bagong access token.
app.jwt.refresh-expiration-ms=2592000000

# --- App version (para sa in-app update checker) ---
# ITO ANG PALITAN MO TUWING MAY BAGONG BUILD NG ANDROID APP:
# 1. Palitan ang versionCode sa app/build.gradle (dagdagan ng 1)
# 2. I-build ang bagong APK sa rv2ide
# 3. I-upload ang APK sa isang bagong GitHub Release, kopyahin ang direct
#    download link ng .apk file
# 4. I-update ang tatlong values sa ibaba (dapat tumugma ang versionCode dito
#    sa versionCode ng build.gradle)
app.version.code=3
app.version.name=2.5
app.version.apk-url=https://github.com/stian16-art/social-network-backend/releases/download/2.5/Talkora.2.5.apk
app.version.notes=Message Available for beta test! 

# --- Firebase (para sa real-time chat) ---
# HUWAG ilagay dito ang totoong value - ito ay babasahin mula sa Railway
# environment variable na FIREBASE_CREDENTIALS_BASE64 (base64-encoded na
# laman ng service account JSON key mo). Tingnan ang instructions tungkol
# dito kung paano i-set up ang Railway env var.
app.firebase.credentials-base64=${FIREBASE_CREDENTIALS_BASE64:}
